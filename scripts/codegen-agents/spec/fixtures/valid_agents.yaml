schema_version: 1

field_keys:
  - input_tokens
  - output_tokens
  - cache_creation_input_tokens
  - cache_read_input_tokens
  - sidechain_messages
  - peak_context_pct
  - total_file_reads
  - total_tool_calls
  - agent_tool_calls
  - skill_tool_calls
  - mcp_tool_calls

metric_slugs:
  - iteration-depth
  - cache-hit-rate
  - sidechain-rate
  - peak-context-pct
  - re-read-rate
  - autonomy-score
  - skill-tool-usage
  - subagent-delegation
  - token-cost-per-pr

agents:
  claude_code:
    label: Claude Code
    color: "#c4621a"
    home_dir_env: AX_CLAUDE_HOME
    home_dir_default: ~/.claude
    hook_scopes: [user]
    fields:
      input_tokens: true
      output_tokens: true
      cache_creation_input_tokens: true
      cache_read_input_tokens: true
      sidechain_messages: true
      peak_context_pct: true
      total_file_reads: true
      total_tool_calls: true
      agent_tool_calls: true
      skill_tool_calls: true
      mcp_tool_calls: true
    metrics:
      iteration-depth: true
      cache-hit-rate: true
      sidechain-rate: true
      peak-context-pct: true
      re-read-rate: true
      autonomy-score: true
      skill-tool-usage: true
      subagent-delegation: true
      token-cost-per-pr: true
