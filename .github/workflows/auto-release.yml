name: Auto Release CLI

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".goreleaser.yml"

permissions:
  contents: write

jobs:
  # Wait for CI to pass before releasing
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: ^go-
          wait-interval: 15

  auto-tag:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest version and bump patch
        id: bump
        run: |
          latest=$(git tag --sort=-v:refname --list 'v*' | head -n1)
          if [ -z "$latest" ]; then
            echo "new_tag=v0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip leading 'v' and split
          version="${latest#v}"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          patch=$(echo "$version" | cut -d. -f3)

          new_tag="v${major}.${minor}.$((patch + 1))"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Bumping $latest → $new_tag"

      - name: Create and push tag
        run: |
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"
