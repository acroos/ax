<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="AX">
  <title>AX favicon</title>
  <style>
    .ink  { stroke: #1E1912; }
    .clay { fill:   #B0602F; }
